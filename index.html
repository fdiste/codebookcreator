<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>QSF Codebook Generator</title>
    <!--
      Runs app.py entirely in the visitor's browser using stlite
      (Streamlit + Pyodide). Nothing is uploaded to a server.
      To update the public app, just edit app.py and push.
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.3/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.3/build/stlite.js";

      mount(
        {
          requirements: ["pandas", "beautifulsoup4", "xlsxwriter"],
          entrypoint: "app.py",
          files: {
            "app.py": { url: "./app.py" },
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
